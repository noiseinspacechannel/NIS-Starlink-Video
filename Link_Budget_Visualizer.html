                orbitControls.minDistance = 1;
                orbitControls.maxDistance = 500;
                orbitControls.enableDamping = true;
                orbitControls.dampingFactor = 0.08;
            }

            scene.add(new THREE.AmbientLight(0x304060, 0.65));
            const sun = new THREE.DirectionalLight(0xffffff, 1.18);
            sun.position.set(200, 80, 100);
            scene.add(sun);

            const starGeo = new THREE.BufferGeometry();
            const stars = [];
            for (let i = 0; i < 5000; i++) {
                stars.push((Math.random() - 0.5) * 3200, (Math.random() - 0.5) * 3200, (Math.random() - 0.5) * 3200);
            }
            starGeo.setAttribute("position", new THREE.Float32BufferAttribute(stars, 3));
            scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.38, transparent: true, opacity: 0.7 })));

            earthGroup = new THREE.Group();
            scene.add(earthGroup);
            earthGroup.rotation.y = 2.4;
            const earthMat = new THREE.MeshPhongMaterial({ color: 0x22364b, emissive: 0x000510, specular: 0x050505, shininess: 5 });
            const earth = new THREE.Mesh(new THREE.SphereGeometry(ER, 72, 72), earthMat);
            earthGroup.add(earth);
            new THREE.TextureLoader().load("https://unpkg.com/three-globe/example/img/earth-day.jpg", t => {
                earth.material.map = t;
                earth.material.color.setHex(0xffffff);
                earth.material.needsUpdate = true;
            });
            earthGroup.add(new THREE.Mesh(new THREE.SphereGeometry(ER + 0.08, 64, 64), new THREE.MeshBasicMaterial({ color: 0x4c7496, wireframe: true, transparent: true, opacity: 0.035 })));

            satGroup = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.12, 0.05), new THREE.MeshPhongMaterial({ color: 0xd6dce6, emissive: 0x25282b }));
            satGroup.add(body);
            const panelMat = new THREE.MeshPhongMaterial({ color: 0x244a88, emissive: 0x0b1830 });
            const pL = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.1, 0.008), panelMat);
            pL.position.x = -0.34;
            satGroup.add(pL);
            const pR = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.1, 0.008), panelMat);
            pR.position.x = 0.34;
            satGroup.add(pR);
            scene.add(satGroup);

            linkGroup = new THREE.Group();
            scene.add(linkGroup);
            particleGeometry = new THREE.BufferGeometry();
            particleMaterial = new THREE.PointsMaterial({ size: 0.018, vertexColors: true, transparent: true, opacity: 0.82, blending: THREE.AdditiveBlending, depthWrite: false });
            particleMesh = new THREE.Points(particleGeometry, particleMaterial);
            linkGroup.add(particleMesh);

            resizeCanvases();
            rebuild3D();
        }

        function getOrbitIncl() {
            return P.inc * DEG;
        }

        function clamp(x, min, max) {
            return Math.max(min, Math.min(max, x));
        }

        function psiForElevationDeg(elevationDeg) {
            const h = P.alt * 1e3;
            const elevation = Math.max(elevationDeg * DEG, 1 * DEG);
            const incAngle = Math.PI / 2 - elevation;
            const rOrbit = R_E + h;
            const sinLook = (R_E / rOrbit) * Math.sin(incAngle);
            const lookAngle = Math.asin(clamp(sinLook, -1, 1));
            return Math.PI / 2 - lookAngle;
        }

        function updateSatPosition3D() {
            const altScene = P.alt * SC;
            const orbitR = ER + altScene;
            const inc = getOrbitIncl();
            const latRad = P.lat * DEG;
            const sinPhase = Math.min(Math.max(Math.sin(latRad) / Math.max(Math.sin(inc), 1e-6), -1), 1);
            const phase = -Math.asin(sinPhase);
            const pos = new THREE.Vector3(orbitR * Math.cos(phase), 0, orbitR * Math.sin(phase));
            const vel = new THREE.Vector3(Math.sin(phase), 0, -Math.cos(phase)).normalize();
            const rotInc = new THREE.Matrix4().makeRotationX(inc);
            pos.applyMatrix4(rotInc);
            vel.applyMatrix4(rotInc);

            const zAxis = pos.clone().normalize().negate();
            const yAxis = vel.clone();
            const xAxis = new THREE.Vector3().crossVectors(yAxis, zAxis).normalize();
            const m = new THREE.Matrix4();
            m.makeBasis(xAxis, yAxis, zAxis);
            m.setPosition(pos);
            satGroup.matrixAutoUpdate = false;
            satGroup.matrix.copy(m);
            satPos.world = pos;
            return { pos, vel, xAxis, yAxis, zAxis, matrix: m };
        }

        function computeBeam3D(frame, squintOverrideDeg = P.sqt, elevationOverrideDeg = P.el) {
            const up = new THREE.Vector3(0, 0, 1);
            const velDir = new THREE.Vector3(0, 1, 0);
            const crossTrack = new THREE.Vector3(1, 0, 0);
            const psi = psiForElevationDeg(elevationOverrideDeg);
            const offNadir = Math.PI / 2 - psi;
            const squint = squintOverrideDeg * DEG;
            const beamLocal = new THREE.Vector3()
                .addScaledVector(up, Math.cos(offNadir))
                .addScaledVector(crossTrack, Math.sin(offNadir) * Math.cos(squint))
                .addScaledVector(velDir, Math.sin(offNadir) * Math.sin(squint))
                .normalize();
            const rot = new THREE.Matrix4().extractRotation(frame.matrix);
            const dirWorld = beamLocal.clone().applyMatrix4(rot).normalize();
            const satWorld = frame.pos.clone();
            const a = dirWorld.dot(dirWorld);
            const b = 2 * satWorld.dot(dirWorld);
            const c = satWorld.dot(satWorld) - ER * ER;
            const disc = b * b - 4 * a * c;
            if (disc < 0) return null;
            const dist = (-b - Math.sqrt(disc)) / (2 * a);
            const ground = satWorld.clone().add(dirWorld.clone().multiplyScalar(dist));
            satPos.ground = ground;
            satPos.dir = dirWorld;
            return { satWorld, ground, dirWorld, dist, squintDeg: squintOverrideDeg, elevationDeg: elevationOverrideDeg };
        }

        function clearLinkObjects() {
            if (!linkGroup) return;
            function disposeObject(obj) {
                obj.traverse(child => {
                    if (child.geometry) child.geometry.dispose();
                    if (child.material) {
                        const materials = Array.isArray(child.material) ? child.material : [child.material];
                        materials.forEach(mat => mat.dispose());
                    }
                });
            }
            for (let i = linkGroup.children.length - 1; i >= 0; i--) {
                const obj = linkGroup.children[i];
                if (obj === particleMesh) continue;
                linkGroup.remove(obj);
                disposeObject(obj);
            }
        }

        function addLaserCylinder(a, b, color = 0xff3d3d, opacity = 0.74, radius = 0.012) {
            const delta = b.clone().sub(a);
            const length = delta.length();
            if (!isFinite(length) || length <= 1e-6) return null;
            const geo = new THREE.CylinderGeometry(radius, radius, length, 10, 1, true);
            const mat = new THREE.MeshBasicMaterial({
                color,
                transparent: true,
                opacity,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            const laser = new THREE.Mesh(geo, mat);
            laser.userData.kind = "laser-link";
            laser.position.copy(a.clone().add(b).multiplyScalar(0.5));
            laser.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), delta.normalize());
            linkGroup.add(laser);
            return laser;
        }

        function addLaserSatellite(position, color = 0x9fd6ff, shell = "same") {
            const group = new THREE.Group();
            group.userData.kind = "laser-satellite";
            group.userData.shell = shell;
            group.position.copy(position);
            const body = new THREE.Mesh(
                new THREE.BoxGeometry(0.105, 0.045, 0.035),
                new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.92 })
            );
            const panelMat = new THREE.MeshBasicMaterial({ color: 0x2d6ccf, transparent: true, opacity: 0.76 });
            const panel = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.038, 0.006), panelMat);
            panel.position.y = -0.055;
            const glint = new THREE.Mesh(
                new THREE.SphereGeometry(0.025, 14, 14),
                new THREE.MeshBasicMaterial({ color: 0xf4fbff, transparent: true, opacity: 0.88 })
            );
            glint.position.y = 0.045;
            group.add(panel, body, glint);
            const radial = position.clone().normalize();
            group.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), radial);
            linkGroup.add(group);
            return group;
        }

        function orbitPoint(altKm, incDeg, phaseRad, raanRad = 0) {
            const r = ER + altKm * SC;
            const pos = new THREE.Vector3(r * Math.cos(phaseRad), 0, r * Math.sin(phaseRad));
            pos.applyMatrix4(new THREE.Matrix4().makeRotationX(incDeg * DEG));
            if (raanRad) pos.applyAxisAngle(new THREE.Vector3(0, 0, 1), raanRad);
            return pos;
        }

        function addOrbitTrack(altKm, incDeg, color, opacity = 0.16, raanRad = 0) {
            const pts = [];
            for (let i = 0; i <= 256; i++) {
                pts.push(orbitPoint(altKm, incDeg, (i / 256) * Math.PI * 2, raanRad));
            }
            const geo = new THREE.BufferGeometry().setFromPoints(pts);
            const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color, transparent: true, opacity }));
            line.userData.kind = "laser-orbit";
            linkGroup.add(line);
            return line;
        }

        function lineOfSightClear(a, b) {
            const ab = b.clone().sub(a);
            const t = clamp(-a.dot(ab) / Math.max(ab.lengthSq(), 1e-9), 0, 1);
            return a.clone().addScaledVector(ab, t).length() > ER + 0.08;
        }

        function nearestOtherShellSatellite(mainPos, altKm, incDeg, raanRad) {
            let best = null;
            for (let i = 0; i < 720; i++) {
                const phase = (i / 720) * Math.PI * 2;
                const pos = orbitPoint(altKm, incDeg, phase, raanRad);
                const clear = lineOfSightClear(mainPos, pos);
                const score = mainPos.angleTo(pos) + (clear ? 0 : 10);
                if (!best || score < best.score) best = { pos, phase, clear, score };
            }
            return best ? best.pos : null;
        }

        function addLaserNetwork(frame) {
            if (!P.showLasers || !linkGroup || !frame || !frame.pos) return;
            const sameOffsetsDeg = [-28, -21, -14, -7, 7, 14, 21, 28];
            const samePositions = sameOffsetsDeg.map(deg => frame.pos.clone().applyAxisAngle(frame.xAxis, deg * DEG));
            addOrbitTrack(P.alt, P.inc, 0x4fbfff, 0.12, 0);
            const chain = [
                ...samePositions.slice(0, 4),
                frame.pos,
                ...samePositions.slice(4)
            ];
            samePositions.forEach(pos => addLaserSatellite(pos, 0x9fd6ff, "same"));
            for (let i = 0; i < chain.length - 1; i++) {
                addLaserCylinder(chain[i], chain[i + 1], 0xff3d3d, 0.66, 0.010);
            }

            const otherAltKm = P.alt <= 355 ? 340 : Math.max(300, P.alt - 10);
            const otherIncDeg = P.alt <= 355 ? 53 : clamp(P.inc + 5, 30, 70);
            const otherRaan = 18 * DEG;
            addOrbitTrack(otherAltKm, otherIncDeg, 0xbb7cff, 0.13, otherRaan);
            const otherPos = nearestOtherShellSatellite(frame.pos, otherAltKm, otherIncDeg, otherRaan);
            if (otherPos) {
                addLaserSatellite(otherPos, 0xd5b8ff, "other");
                addLaserCylinder(frame.pos, otherPos, 0xff3d3d, 0.82, 0.013);
            }
        }

        function addBeamVisual(beam, color, opacity = 0.12, radiusScale = 1) {
            const segment = txBeamSegment(beam);
            const start = segment.start;
            const end = segment.end;
            const lineGeo = new THREE.BufferGeometry().setFromPoints([start, end]);
            linkGroup.add(new THREE.Line(lineGeo, new THREE.LineBasicMaterial({ color, transparent: true, opacity })));
        }

        function addMainBeamCone(beam, color, opacity = 0.075, thetaOverride = null) {
            const segment = txBeamSegment(beam);
            const theta = Math.min(thetaOverride || LINK.txThetaEl || LINK.thetaEl || 12 * DEG, 140 * DEG);
            const radius = Math.tan(theta / 2) * segment.length;
            const coneGeo = new THREE.ConeGeometry(radius, segment.length, 48, 1, true);
            const coneMat = new THREE.MeshBasicMaterial({
                color,
                transparent: true,
                opacity,
                depthWrite: false,
                side: THREE.DoubleSide
            });
            const cone = new THREE.Mesh(coneGeo, coneMat);
            cone.position.copy(segment.start.clone().addScaledVector(segment.pointing, segment.length / 2));
            cone.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), segment.pointing.clone().negate());
            linkGroup.add(cone);
        }

        function computeLocalBeam3D(frame, offNadirRad, azimuthRad) {
            const satWorld = frame.pos.clone();
            const dirWorld = frame.zAxis.clone().multiplyScalar(Math.cos(offNadirRad))
                .addScaledVector(frame.xAxis, Math.sin(offNadirRad) * Math.cos(azimuthRad))
                .addScaledVector(frame.yAxis, Math.sin(offNadirRad) * Math.sin(azimuthRad))
                .normalize();
            const a = dirWorld.dot(dirWorld);
            const b = 2 * satWorld.dot(dirWorld);
            const c = satWorld.dot(satWorld) - ER * ER;
            const disc = b * b - 4 * a * c;
            if (disc < 0) return null;
            const dist = (-b - Math.sqrt(disc)) / (2 * a);
            const ground = satWorld.clone().add(dirWorld.clone().multiplyScalar(dist));
            return { satWorld, ground, dirWorld, dist, squintDeg: azimuthRad / DEG, elevationDeg: 90 - offNadirRad / DEG };
        }

        function highDensitySpreadRad(frame, count) {
            const n = Math.max(1, Math.round(count || 1));
            const horizonOffNadir = Math.asin(clamp(ER / frame.pos.length(), -1, 1));
            const fullSwath = Math.min(70 * DEG, Math.max(8 * DEG, horizonOffNadir - 1.5 * DEG));
            const baseSpread = 0.5 * fullSwath;
            const beamTheta = Math.min(LINK.txThetaEl || LINK.thetaEl || 12 * DEG, 130 * DEG);
            const beamHalf = Math.max(0.05 * DEG, beamTheta / 2);
            const packingFill = 0.78;
            const filledCenterRadius = beamHalf * Math.max(0, Math.sqrt(n * packingFill) - 1);
            return Math.min(fullSwath, Math.max(baseSpread, filledCenterRadius));
        }

        function parallelNadirConeBeams(frame, count) {
            const n = Math.max(1, Math.round(count || 1));
            const maxOffNadir = highDensitySpreadRad(frame, n);
            const goldenAngle = Math.PI * (3 - Math.sqrt(5));
            return Array.from({ length: n }, (_, i) => {
                const radius = i === 0 ? 0 : Math.sqrt((i - 0.5) / Math.max(1, n - 1));
                const azimuth = P.sqt * DEG + i * goldenAngle;
                return computeLocalBeam3D(frame, radius * maxOffNadir, azimuth);
            }).filter(Boolean);
        }

        function txBeamSegment(beam) {
            const start = P.direction === "downlink" ? beam.satWorld : beam.ground;
            const pointing = P.direction === "downlink"
                ? beam.ground.clone().sub(beam.satWorld).normalize()
                : beam.satWorld.clone().sub(beam.ground).normalize();
            const length = P.direction === "downlink" ? beam.satWorld.distanceTo(beam.ground) : UPLINK_VIS_KM * SC;
            const end = start.clone().addScaledVector(pointing, length);
            return { start, end, pointing, length };
        }

        function addGroundFootprintRing(beam, frame, theta, color, opacity = 0.72) {
            const normal = beam.ground.clone().normalize();
            const velWorld = frame.yAxis.clone().normalize();
            const t1 = velWorld.clone().sub(normal.clone().multiplyScalar(velWorld.dot(normal))).normalize();
            const t2 = new THREE.Vector3().crossVectors(normal, t1).normalize();
            const radius = Math.tan(theta / 2) * (beam.dist || LINK.rSlant * SC / 1000);
            const azR = radius;
            const rgR = radius;
            const ringPts = [];
            for (let i = 0; i <= 96; i++) {
                const a = i / 96 * Math.PI * 2;
                ringPts.push(beam.ground.clone()
                    .addScaledVector(t1, Math.cos(a) * azR)
                    .addScaledVector(t2, Math.sin(a) * rgR)
                    .multiplyScalar(1.0008));
            }
            const ringGeo = new THREE.BufferGeometry().setFromPoints(ringPts);
            linkGroup.add(new THREE.Line(ringGeo, new THREE.LineBasicMaterial({ color, transparent: true, opacity })));
        }

        function groundMarkerPosition(beam, lift = 0.05) {
            const towardSat = beam.satWorld.clone().sub(beam.ground).normalize();
            return beam.ground.clone().addScaledVector(towardSat, lift);
        }

        function elevationRingOffset(index) {
            if (index === 0) return 0;
            const step = 7.5 * Math.ceil(index / 2);
            return index % 2 ? -step : step;
        }

        function parallelLinkLooks(count) {
            const n = Math.max(1, Math.round(count || 1));
            const baseEl = clamp(P.el, 5, 85);
            if (n === 1) return [{ squint: P.sqt, elevation: baseEl }];

            if (n < 10) {
                const spread = n === 2 ? 90 : Math.min(140, 56 + n * 12);
                return Array.from({ length: n }, (_, i) => ({
                    squint: P.sqt + (i - (n - 1) / 2) * (spread / Math.max(n - 1, 1)),
                    elevation: baseEl
                }));
            }

            const coneHalfSquint = 70;
            const coneHalfElevation = 32;
            const goldenAngle = Math.PI * (3 - Math.sqrt(5));
            return Array.from({ length: n }, (_, i) => {
                if (i === 0) return { squint: P.sqt, elevation: baseEl };
                const radius = Math.sqrt((i + 0.5) / n);
                const angle = i * goldenAngle;
                return {
                    squint: P.sqt + Math.cos(angle) * coneHalfSquint * radius,
                    elevation: clamp(baseEl + Math.sin(angle) * coneHalfElevation * radius, 5, 85)
                };
            });
        }

        function rebuild3D() {
            if (!scene || !satGroup || !linkGroup) return;
            recalc();
            const frame = updateSatPosition3D();
            clearLinkObjects();
            activeTxBeams = [];
            activeTxSegments = [];
            particleMesh.visible = false;
            addLaserNetwork(frame);

            if (P.aggregate) {
                rebuildAggregate3D(frame);
                return;
            }

            const beams = parallelLinkLooks(LINK.linkCount).map(look => computeBeam3D(frame, look.squint, look.elevation)).filter(Boolean);
            if (!beams.length) return;
            const showParticles = LINK.linkCount <= 10;
            const highDensityMode = !showParticles;
            const visualBeams = highDensityMode ? parallelNadirConeBeams(frame, LINK.linkCount) : beams;
            if (!visualBeams.length) return;
            activeTxBeams = visualBeams;
            activeTxSegments = visualBeams.map(txBeamSegment);
            particleMesh.visible = showParticles;
            particlesDirty = showParticles;

            const color = P.direction === "downlink" ? 0xe8c64a : 0x45e2a0;
            const beamOpacity = Math.max(0.42, 0.82 / Math.sqrt(visualBeams.length));
            visualBeams.forEach((beam, idx) => {
                if (highDensityMode) {
                    addMainBeamCone(beam, color, Math.max(0.045, 0.22 / Math.sqrt(visualBeams.length)));
                } else {
                    addBeamVisual(beam, color, beamOpacity, 1);
                }

                const groundMarker = new THREE.Mesh(new THREE.SphereGeometry(0.037, 18, 18), new THREE.MeshBasicMaterial({ color: 0x45e2a0 }));
                groundMarker.position.copy(groundMarkerPosition(beam, 0.045));
                linkGroup.add(groundMarker);

                if (!highDensityMode) {
                    const footprintTheta = P.direction === "uplink" ? LINK.rxThetaEl : LINK.txThetaEl;
                    addGroundFootprintRing(beam, frame, footprintTheta, P.direction === "uplink" ? 0x8fb7ff : 0x45e2a0, Math.max(0.38, 0.72 / Math.sqrt(beams.length)));
                }
            });

            if (showParticles) {
                const count = Math.max(50, Math.floor(P.particleCount));
                if (particleSeeds.length !== count || particleSeedLinkCount !== visualBeams.length) {
                    particleSeedLinkCount = visualBeams.length;
                    particleSeeds = Array.from({ length: count }, () => makePatternSeed(visualBeams.length));
                    particleGeometry.setAttribute("position", new THREE.BufferAttribute(new Float32Array(count * 3), 3));
                    particleGeometry.setAttribute("color", new THREE.BufferAttribute(new Float32Array(count * 3), 3));
                }
            }

            const centerGround = visualBeams.reduce((acc, beam) => acc.add(beam.ground), new THREE.Vector3()).multiplyScalar(1 / visualBeams.length);
            const cameraTarget = frame.pos.clone().lerp(centerGround, 0.56);
            const surfaceNormal = centerGround.clone().normalize();
            if (!cameraInitialized) {
                cam3.position.copy(cameraTarget.clone()
                    .addScaledVector(frame.xAxis, 8.0)
                    .addScaledVector(frame.yAxis, -4.5)
                    .addScaledVector(surfaceNormal, 4.8));
                if (orbitControls) orbitControls.target.copy(cameraTarget);
                cameraInitialized = true;
            }
            if (orbitControls) orbitControls.target.lerp(cameraTarget, 0.16);
        }

        function rebuildAggregate3D(frame) {
            const squints = [-18, -6, 6, 18];
            const stationBeams = squints.map(s => computeBeam3D(frame, s)).filter(Boolean);
            const bandStyles = [
                { id: "backhaul-ka-ul-max", color: 0x46a7e8, radius: 0.62 },
                { id: "backhaul-v-ul-max", color: 0x45e2a0, radius: 0.50 },
                { id: "backhaul-e-ul-max", color: 0xe8c64a, radius: 0.40 },
                { id: "backhaul-w113-ul-max", color: 0xe88946, radius: 0.32 }
            ];

            stationBeams.forEach((beam, idx) => {
                const marker = new THREE.Mesh(
                    new THREE.SphereGeometry(0.043, 18, 18),
                    new THREE.MeshBasicMaterial({ color: 0xf2fff9 })
                );
                marker.position.copy(groundMarkerPosition(beam, 0.052));
                linkGroup.add(marker);

                const ring = new THREE.Mesh(
                    new THREE.RingGeometry(0.16, 0.22, 32),
                    new THREE.MeshBasicMaterial({ color: 0x45e2a0, transparent: true, opacity: 0.62, side: THREE.DoubleSide })
                );
                ring.position.copy(beam.ground.clone().multiplyScalar(1.0015));
                ring.lookAt(new THREE.Vector3(0, 0, 0));
                linkGroup.add(ring);
            });

            bandStyles.forEach(style => {
                const preset = PRESETS.find(p => p.id === style.id);
                const count = Math.min(preset.linkCount || 1, stationBeams.length);
                const stationIndexes = count >= 4 ? [0, 1, 2, 3] : [1, 2];
                stationIndexes.slice(0, count).forEach((stationIdx, offsetIdx) => {
                    const beam = stationBeams[stationIdx];
                    if (!beam) return;
                    addBeamVisual(beam, style.color, 0.74, style.radius);
                });
            });

            const center = stationBeams.reduce((acc, beam) => acc.add(beam.ground), new THREE.Vector3()).multiplyScalar(1 / Math.max(stationBeams.length, 1));
            const sat = frame.pos.clone();
            const cameraTarget = sat.clone().lerp(center, 0.62);
            const surfaceNormal = center.clone().normalize();
            if (!cameraInitialized) {
                cam3.position.copy(cameraTarget.clone()
                    .addScaledVector(frame.xAxis, 10.0)
                    .addScaledVector(frame.yAxis, -7.2)
                    .addScaledVector(surfaceNormal, 6.5));
                if (orbitControls) orbitControls.target.copy(cameraTarget);
                cameraInitialized = true;
            }
            if (orbitControls) orbitControls.target.lerp(cameraTarget, 0.16);
        }

        const PATTERN_MAX_NORM = 9.0;
        const SIDELOBE_VIS_SCALE = 4.25;
        const PATTERN_FLOOR_DB = -42;

        function clamp01(x) {
            return Math.max(0, Math.min(1, x));
        }

        function besselJ1(x) {
            const sign = x < 0 ? -1 : 1;
            const ax = Math.abs(x);
            if (ax < 1e-6) return x / 2;
            let term = ax / 2;
            let sum = term;
            for (let k = 1; k < 36; k++) {
                term *= -(ax * ax) / (4 * k * (k + 1));
                sum += term;
                if (Math.abs(term) < Math.max(1e-9, Math.abs(sum) * 1e-8)) break;
            }
            return sign * sum;
        }

        function circularAperturePower(normAngle) {
            const u = 1.61633995 * Math.max(0, normAngle);
            if (u < 1e-6) return 1;
            const field = 2 * besselJ1(u) / u;
            return Math.max(0, field * field);
        }

        function patternDisplay(power) {
            const logMix = clamp01(P.sidelobeScale / 100);
            const linear = clamp01(power);
            const db = Math.max(PATTERN_FLOOR_DB, db10(power));
            const logScaled = clamp01((db - PATTERN_FLOOR_DB) / -PATTERN_FLOOR_DB);
            return clamp01(linear * (1 - logMix) + Math.pow(logScaled, 1.15) * logMix);
        }

        function samplePatternRadius() {
            for (let attempt = 0; attempt < 90; attempt++) {
                const rNorm = Math.sqrt(Math.random()) * PATTERN_MAX_NORM;
                const weight = Math.pow(circularAperturePower(rNorm), 0.38);
                if (Math.random() < weight) return rNorm;
            }
            return Math.pow(Math.random(), 0.7) * 1.35;
        }

        function makePatternSeed(linkCount = 1) {
            return {
                f: 0.015 + Math.random() * 0.97,
                rNorm: samplePatternRadius(),
                broadR: Math.sqrt(Math.random()),
                broadDist: Math.cbrt(Math.random()),
                broadCos: 2 * Math.random() - 1,
                a: Math.random() * Math.PI * 2,
                linkIndex: Math.floor(Math.random() * Math.max(1, linkCount))
            };
        }

        function updateParticles(timeMs) {
            if (P.aggregate) return;
            if (!particleMesh || !particleMesh.visible || !activeTxBeams.length) return;
            if (!particleGeometry.attributes.position || !particleGeometry.attributes.color) return;
            if (!particlesDirty) return;
            const arr = particleGeometry.attributes.position.array;
            const colors = particleGeometry.attributes.color.array;
            const baseColor = P.direction === "downlink"
                ? { r: 1.00, g: 0.82, b: 0.22 }
                : { r: 0.28, g: 1.00, b: 0.67 };
            const brightness = 0.20 + 0.18 * P.particleBright;
            const broadTx = P.txGain < 10;
            for (let i = 0; i < particleSeeds.length; i++) {
                const seed = particleSeeds[i];
                const segment = activeTxSegments[seed.linkIndex % activeTxSegments.length] || activeTxSegments[0];
                const dir = segment.pointing;
                let side = new THREE.Vector3().crossVectors(dir, new THREE.Vector3(0, 0, 1));
                if (side.length() < 0.001) side = new THREE.Vector3().crossVectors(dir, new THREE.Vector3(0, 1, 0));
                side.normalize();
                const up = new THREE.Vector3().crossVectors(side, dir).normalize();
                const f = seed.f;
                const maxRadius = Math.tan((LINK.txThetaEl || LINK.thetaEl) / 2) * segment.length;
                let point;
                let display;
                if (broadTx) {
                    const cosTheta = seed.broadCos;
                    const sinTheta = Math.sqrt(Math.max(0, 1 - cosTheta * cosTheta));
                    const emitDir = dir.clone().multiplyScalar(cosTheta)
                        .addScaledVector(side, Math.cos(seed.a) * sinTheta)
                        .addScaledVector(up, Math.sin(seed.a) * sinTheta)
                        .normalize();
                    const forwardBias = 0.72 + 0.28 * Math.max(0, cosTheta);
                    display = Math.pow(forwardBias, 0.72);
                    point = segment.start.clone().addScaledVector(emitDir, segment.length * seed.broadDist);
                } else {
                    const rNorm = seed.rNorm;
                    const radialFrac = (rNorm / PATTERN_MAX_NORM) * SIDELOBE_VIS_SCALE;
                    const power = circularAperturePower(rNorm);
                    display = patternDisplay(power);
                    const radius = maxRadius * f * radialFrac;
                    point = segment.start.clone()
                        .addScaledVector(dir, segment.length * f)
                        .addScaledVector(side, Math.cos(seed.a) * radius)
                        .addScaledVector(up, Math.sin(seed.a) * radius);
                }
                arr[i * 3] = point.x;
                arr[i * 3 + 1] = point.y;
                arr[i * 3 + 2] = point.z;
                const intensity = clamp01(Math.pow(display, broadTx ? 0.82 : 0.90) * brightness);
                const hot = intensity * intensity * 0.35;
                colors[i * 3] = clamp01(baseColor.r * intensity + hot);
                colors[i * 3 + 1] = clamp01(baseColor.g * intensity + hot);
                colors[i * 3 + 2] = clamp01(baseColor.b * intensity + hot);
            }
            particleMaterial.size = 0.009 + Math.min(P.particleBright, 20) * 0.0012;
            particleGeometry.attributes.position.needsUpdate = true;
            particleGeometry.attributes.color.needsUpdate = true;
            particlesDirty = false;
        }

        let lastRecalc = 0;
        function animate(time) {
            requestAnimationFrame(animate);
            if (time - lastRecalc > 750) {
                recalc();
                lastRecalc = time;
            }
            updateParticles(time);
            drawModulationPanel();
            if (orbitControls) orbitControls.update();
            if (renderer && scene && cam3) renderer.render(scene, cam3);
        }

        window.addEventListener("resize", resizeCanvases);

        bindControls();
        applyPreset(P.preset);
        init3D();
        resizeCanvases();
        requestAnimationFrame(animate);
    </script>
</body>

</html>
